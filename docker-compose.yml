
services:
  db:
    image: postgres:16-alpine
    container_name: gestao-estoque-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestao_estoque
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestao_estoque"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestao-estoque-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  studio:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: npx prisma studio --hostname 0.0.0.0 --port 5555 --browser none
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "5555:5555"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
